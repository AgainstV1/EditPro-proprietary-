name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble project from uploaded files
        id: locate
        shell: bash
        run: |
          set -e
          # Already a proper Gradle layout? Use it as-is.
          if [ -f app/build.gradle.kts ] && [ -f settings.gradle.kts ] && [ -d app/src ]; then
            echo "Structured repo detected"
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          P=_proj
          rm -rf "$P"; mkdir -p "$P"
          J=app/src/main/java/com/editpro/studio
          missing=""

          find_flat() {
            local base="${1%.*}" ext="${1##*.}" f
            f=$(find . -maxdepth 1 -type f -name "$1" | head -1)
            if [ -z "$f" ]; then f=$(find . -maxdepth 1 -type f -name "${base}*.${ext}" | head -1); fi
            echo "$f"
          }
          place() {
            local f
            f=$(find_flat "$1")
            if [ -z "$f" ]; then echo "MISSING: $1"; missing="$missing $1"; return; fi
            mkdir -p "$P/$2"; cp "$f" "$P/$2/$1"; echo "OK: $1 -> $2"
          }

          place AndroidManifest.xml        app/src/main
          place strings.xml                app/src/main/res/values
          place themes.xml                 app/src/main/res/values
          place file_paths.xml             app/src/main/res/xml
          place MainActivity.kt            $J
          place EditProViewModel.kt        $J/viewmodel
          place InspectorAndDialogsUi.kt   $J/ui
          place PreviewStageUi.kt          $J/ui
          place ThemeAndIcons.kt           $J/ui
          place TimelineUi.kt              $J/ui
          place Models.kt                  $J/model
          place PresetCatalog.kt           $J/model
          place ProjectSerializer.kt       $J/model
          place MediaEngine.kt             $J/media
          place NativeVideoExporter.kt     $J/media

          # Optional: unit test (not needed to build the APK)
          T=$(find_flat EditProEngineTest.kt)
          if [ -n "$T" ]; then mkdir -p "$P/app/src/test/java/com/editpro/studio"; cp "$T" "$P/app/src/test/java/com/editpro/studio/EditProEngineTest.kt"; fi

          # Gradle files, matched by content so odd file names still work
          BUILDS=$(find . -maxdepth 1 -type f -name 'build*.kts')
          APP=""
          if [ -n "$BUILDS" ]; then APP=$(grep -l "namespace" $BUILDS </dev/null | head -1 || true); fi
          if [ -z "$APP" ]; then echo "MISSING: app build.gradle.kts"; missing="$missing app-build.gradle.kts"; else mkdir -p "$P/app"; cp "$APP" "$P/app/build.gradle.kts"; echo "OK: $APP -> app/build.gradle.kts"; fi

          SET=$(find . -maxdepth 1 -type f -name 'settings*.kts' | head -1)
          if [ -z "$SET" ]; then echo "MISSING: settings.gradle.kts"; missing="$missing settings.gradle.kts"; else cp "$SET" "$P/settings.gradle.kts"; echo "OK: $SET -> settings.gradle.kts"; fi

          PROPS=$(find . -maxdepth 1 -type f -name 'gradle*.properties' | head -1)
          if [ -n "$PROPS" ]; then cp "$PROPS" "$P/gradle.properties"; else
            printf 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n' > "$P/gradle.properties"
          fi

          # Root build file (plugin versions) - use the uploaded one if it has versions, else generate
          ROOT=""
          if [ -n "$BUILDS" ]; then ROOT=$(grep -l "apply false" $BUILDS </dev/null | head -1 || true); fi
          if [ -n "$ROOT" ]; then cp "$ROOT" "$P/build.gradle.kts"; else
          cat > "$P/build.gradle.kts" <<'GRADLE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          GRADLE
          fi
          # Heredoc lines above are de-indented by YAML, but be safe:
          sed -i 's/^[[:space:]]*//' "$P/build.gradle.kts"

          echo "# release-only rules" > "$P/app/proguard-rules.pro"

          if [ -n "$missing" ]; then
            echo ""
            echo "ERROR: these files were not found in the repo root:$missing"
            echo "Upload them to the root of the repo and run again."
            exit 1
          fi

          echo "--- Assembled project ---"
          find "$P" -type f | sort
          echo "dir=$P" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK (preinstalled on runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find "${{ steps.locate.outputs.dir }}" -path '*outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced"; exit 1; fi
          cp "$APK" out/EditPro-debug.apk
          ls -la out

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EditPro-APK
          path: out/EditPro-debug.apk

      - name: Publish APK to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/EditPro-debug.apk

      - name: Show errors in summary (only if build failed)
        if: failure()
        shell: bash
        run: |
          LOG="${{ steps.locate.outputs.dir }}/build.log"
          if [ -f "$LOG" ]; then
            {
              echo "## Build errors"
              echo '```'
              grep -E "^e: |error:|What went wrong|Execution failed|Could not resolve|was not found" -A4 "$LOG" | head -100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full log (only if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.locate.outputs.dir }}/build.log
          if-no-files-found: ignore

# Builds the Edit Pro Studio Android app and publishes installable APK artifacts.
name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Run lint (non-blocking)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EditPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release (unsigned) APK
        uses: actions/upload-artifact@v4
        with:
          name: EditPro-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  release:
    name: Attach APKs to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: EditPro-debug-apk
          path: dist/debug

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: EditPro-release-unsigned-apk
          path: dist/release

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp dist/debug/*.apk out/EditPro-${{ github.ref_name }}-debug.apk
          cp dist/release/*.apk out/EditPro-${{ github.ref_name }}-release-unsigned.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
